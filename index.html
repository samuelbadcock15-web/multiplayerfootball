<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Goody Tonight Show - Live Studio Master Display</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #05020a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas3d { width: 100%; height: 100%; display: block; }
    
    #hud {
      position: absolute; top: 18px; left: 20px; background: rgba(22, 9, 44, 0.88);
      border: 2px solid #ff79b0; border-radius: 12px; padding: 12px 18px; color: #fff;
      font-family: monospace; font-size: 0.85rem; pointer-events: none; z-index: 20;
    }
    #room-code-pill { margin-top: 5px; font-weight: bold; color: #39ff14; font-size: 0.95rem; }
    #countdown-pill { margin-top: 6px; font-weight: bold; color: #ffda66; font-size: 0.95rem; }
    #match-clock-hud { margin-top: 4px; font-weight: bold; color: #00f0ff; font-size: 0.95rem; }
    #audience-pill { margin-top: 4px; font-weight: bold; color: #39ff14; }

    #blocker {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8, 4, 16, 0.94); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fff; z-index: 100; text-align: center;
      padding: 20px; cursor: pointer;
    }
    #instructions-card {
      background: #1c0a32; border: 3px solid #ff79b0; border-radius: 18px;
      padding: 24px 32px; box-shadow: 0 0 35px rgba(255, 121, 176, 0.35); max-width: 600px; width: 90%;
    }
    h1 { color: #ffda66; margin-top: 0; font-size: 1.6rem; letter-spacing: 1.5px; }
    p { color: #ebdcf9; font-size: 0.92rem; line-height: 1.5; margin: 8px 0; }
    .room-code-display {
      font-size: 3.2rem; font-weight: 900; letter-spacing: 12px; color: #39ff14;
      font-family: monospace; margin: 12px 0 6px 0; text-shadow: 0 0 16px rgba(57, 255, 20, 0.6);
    }
  </style>
</head>
<body>

  <div id="hud">
    <div style="color: #ffda66; font-weight: bold;">STUDIO MASTER MONITOR</div>
    <div id="room-code-pill">SESSION PIN: <span id="hud-code-val">----</span></div>
    <div id="countdown-pill">STATUS: <span id="timer-val" style="color:#ff7675;">STUDIO STANDBY</span></div>
    <div id="match-clock-hud">SHOW CLOCK: <span id="game-clock-val" style="color:#ffda66;">20:00</span></div>
    <div id="audience-pill">ACTIVE FEEDS: <span id="audience-count" style="color:#39ff14;">0/2</span></div>
  </div>

  <div id="blocker">
    <div id="instructions-card">
      <h1>The Goody Tonight Show</h1>
      <p>24/7 In-Person Studio Active — Click Anywhere to Launch Master Screen</p>
      <div id="entry-code" class="room-code-display">----</div>
      <p>Contestants use fixed Podium PINs <strong>0001</strong> &amp; <strong>0002</strong> on their phones for live face-cams.</p>
    </div>
  </div>

  <canvas id="canvas3d"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script>
    // Generate unique session code for this broadcast instance
    const studioRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('entry-code').textContent = studioRoomCode;
    document.getElementById('hud-code-val').textContent = studioRoomCode;

    let studioPeer = null;
    let studioPower = false;
    let isGoodySpeaking = false;

    // Video streams for Podium 1 and Podium 2 walkie-talkie face-cams
    const videoP1 = document.createElement('video');
    videoP1.autoplay = true; videoP1.playsInline = true; videoP1.muted = false;
    const videoP2 = document.createElement('video');
    videoP2.autoplay = true; videoP2.playsInline = true; videoP2.muted = false;

    let hasLiveP1Stream = false;
    let hasLiveP2Stream = false;

    // Start studio audio/graphics on click blocker
    document.getElementById('blocker').addEventListener('click', () => {
      document.getElementById('blocker').style.display = 'none';
      bootStudioMaster();
    });

    function bootStudioMaster() {
      studioPower = true;
      document.getElementById('timer-val').textContent = "LIVE ON AIR!";
      document.getElementById('timer-val').style.color = "#39ff14";
      initStudioWebRTC();
      speakGoody("Good evening, ladies and gentlemen! Welcome to The Goody Tonight Show! Our physical contestants are locked in at their podiums, and we are live!");
    }

    function initStudioWebRTC() {
      if (studioPeer) return;
      try {
        const dynamicStudioId = "goody-studio-" + studioRoomCode;
        studioPeer = new Peer(dynamicStudioId);

        studioPeer.on('open', (id) => console.log("Master Host Registered:", id));

        studioPeer.on('call', (call) => {
          const pSlot = call.metadata ? call.metadata.podium : null;
          call.answer();

          call.on('stream', (remoteStream) => {
            if (pSlot === "0002") {
              videoP2.srcObject = remoteStream;
              videoP2.play().catch(console.error);
              hasLiveP2Stream = true;
            } else {
              videoP1.srcObject = remoteStream;
              videoP1.play().catch(console.error);
              hasLiveP1Stream = true;
            }
            updateActiveFeedCount();
          });
        });
      } catch(e) { console.error(e); }
    }

    function updateActiveFeedCount() {
      let count = (hasLiveP1Stream ? 1 : 0) + (hasLiveP2Stream ? 1 : 0);
      document.getElementById('audience-count').textContent = `${count}/2`;
    }

    function speakGoody(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = 0.95; utt.pitch = 1.25;
      window.speechSynthesis.speak(utt);
    }

    // --- Three.js 3D Studio Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040208);
    scene.fog = new THREE.FogExp2(0x040208, 0.015);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(0, 5.5, 9);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const ambientLight = new THREE.AmbientLight(0x181026, 0.85); scene.add(ambientLight);
    const ceilingLight = new THREE.PointLight(0xffecd2, 1.0, 50); ceilingLight.position.set(0, 13.5, 0); scene.add(ceilingLight);

    const miniDiorama = new THREE.Group(); miniDiorama.position.set(0, 3.95, -9);
    const feltCarpet = new THREE.Mesh(new THREE.CylinderGeometry(7.0, 7.0, 0.08, 48), new THREE.MeshStandardMaterial({ color: 0x271147 }));
    feltCarpet.position.y = 0.44; miniDiorama.add(feltCarpet);

    // 3D Plushie Avatars representing the in-person physical contestants
    function createPlayerPawn(colorHex) {
      const pawn = new THREE.Group();
      const baseMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.6, roughness: 0.25 });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.10, 0.04, 16), baseMat);
      base.position.y = 0.02; pawn.add(base);
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.16, 16), baseMat);
      body.position.y = 0.12; pawn.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 16), baseMat);
      head.position.y = 0.22; pawn.add(head);
      return pawn;
    }

    const pawn1 = createPlayerPawn(0x00d2d3); pawn1.position.set(-0.6, 0.52, 1.8); miniDiorama.add(pawn1);
    const pawn2 = createPlayerPawn(0xff3838); pawn2.position.set(0.6, 0.52, 1.8); miniDiorama.add(pawn2);
    scene.add(miniDiorama);

    // Dynamic Canvas Texture for Studio Screen Feeds (showing live face-cams)
    const studioScreenCanvas = document.createElement('canvas'); studioScreenCanvas.width = 512; studioScreenCanvas.height = 256;
    const sScreenCtx = studioScreenCanvas.getContext('2d');
    const studioScreenTex = new THREE.CanvasTexture(studioScreenCanvas);

    function renderBackstageScreens() {
      sScreenCtx.fillStyle = '#060210'; sScreenCtx.fillRect(0, 0, 512, 256);
      
      // Draw Podium 1 Feed (Left Screen)
      sScreenCtx.strokeStyle = hasLiveP1Stream ? '#39ff14' : '#ffb300';
      sScreenCtx.lineWidth = 3; sScreenCtx.strokeRect(15, 20, 225, 215);
      if (hasLiveP1Stream && videoP1.readyState >= 2) {
        sScreenCtx.drawImage(videoP1, 17, 22, 221, 211);
      } else {
        sScreenCtx.fillStyle = '#ffda66'; sScreenCtx.font = 'bold 18px sans-serif'; sScreenCtx.textAlign = 'center';
        sScreenCtx.fillText("PODIUM 1 (0001)", 127, 120);
        sScreenCtx.font = '13px monospace'; sScreenCtx.fillText("VOICE/CAM STANDBY", 127, 150);
      }

      // Draw Podium 2 Feed (Right Screen)
      sScreenCtx.strokeStyle = hasLiveP2Stream ? '#39ff14' : '#ffb300';
      sScreenCtx.lineWidth = 3; sScreenCtx.strokeRect(272, 20, 225, 215);
      if (hasLiveP2Stream && videoP2.readyState >= 2) {
        sScreenCtx.drawImage(videoP2, 274, 22, 221, 211);
      } else {
        sScreenCtx.fillStyle = '#ffda66'; sScreenCtx.font = 'bold 18px sans-serif'; sScreenCtx.textAlign = 'center';
        sScreenCtx.fillText("PODIUM 2 (0002)", 384, 120);
        sScreenCtx.font = '13px monospace'; sScreenCtx.fillText("VOICE/CAM STANDBY", 384, 150);
      }
      studioScreenTex.needsUpdate = true;
    }

    const studioBackScreenMesh = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 2.8), new THREE.MeshBasicMaterial({ map: studioScreenTex }));
    studioBackScreenMesh.position.set(0, 3.4, -4.5); miniDiorama.add(studioBackScreenMesh);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderBackstageScreens();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

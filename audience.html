<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Goody Tonight Show - Audience & Contestant Portal</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #06020f; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center;
      overflow: hidden;
    }
    .portal-box {
      background: #140727; border: 2.5px solid #00f0ff; border-radius: 18px;
      padding: 24px 32px; box-shadow: 0 0 40px rgba(0, 240, 255, 0.35);
      text-align: center; max-width: 420px; width: 90%;
    }
    h2 { color: #ffda66; margin-top: 0; font-size: 1.4rem; letter-spacing: 1px; }
    p { color: #ebdcf9; font-size: 0.88rem; line-height: 1.4; margin: 8px 0; }
    input, select {
      width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem;
      background: #070212; color: #fff; border: 2px solid #a29bfe;
      border-radius: 8px; outline: none; margin-bottom: 12px; text-align: center;
    }
    input:focus { border-color: #39ff14; box-shadow: 0 0 10px rgba(57, 255, 20, 0.4); }
    .btn-join {
      width: 100%; padding: 12px; background: linear-gradient(180deg, #39ff14, #27ae60);
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 900;
      color: #06020f; text-transform: uppercase; cursor: pointer; letter-spacing: 1px;
    }
    .btn-join:hover { background: #00f0ff; }
    #live-stage {
      display: none; width: 100%; height: 100%; flex-direction: column; position: relative;
    }
    #video-container {
      flex: 1; background: #000; display: flex; justify-content: center; align-items: center; position: relative;
    }
    video { width: 100%; height: 100%; object-fit: contain; }
    #chat-overlay {
      position: absolute; bottom: 10px; left: 10px; width: 320px; height: 180px;
      background: rgba(10, 3, 20, 0.8); border: 1.5px solid #00f0ff; border-radius: 8px;
      display: flex; flex-direction: column; backdrop-filter: blur(4px); z-index: 20;
    }
    #chat-messages { flex: 1; overflow-y: auto; padding: 6px; font-size: 0.75rem; display: flex; flex-direction: column; gap: 4px; }
    #chat-input-row { display: flex; padding: 4px; border-top: 1px solid #331555; }
    #chat-input { flex: 1; margin: 0; padding: 6px; font-size: 0.75rem; text-align: left; }
    #btn-send-chat { padding: 6px 12px; background: #00f0ff; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; margin-left: 4px; color: #06020f; }
  </style>
</head>
<body>

  <div class="portal-box" id="login-portal">
    <h2>The Goody Tonight Show</h2>
    <p>Join the studio audience or step into the hot seat as a contestant!</p>
    <input type="text" id="input-name" placeholder="Your Name" maxlength="16" />
    <input type="text" id="input-city" placeholder="Your City" maxlength="16" />
    <input type="text" id="input-room" placeholder="Studio Room Code (4 digits)" maxlength="4" inputmode="numeric" />
    <select id="input-role">
      <option value="AUDIENCE">Join as Studio Audience / Spectator</option>
      <option value="goody-contestant-1">Contestant 1 (Podium 1)</option>
      <option value="goody-contestant-2">Contestant 2 (Podium 2)</option>
    </select>
    <button class="btn-join" id="btn-connect">Connect to Studio</button>
  </div>

  <div id="live-stage">
    <div id="video-container">
      <video id="host-video" autoplay playsinline></video>
    </div>
    <div id="chat-overlay">
      <div style="padding: 4px 8px; font-size: 0.7rem; color: #ffda66; font-family: monospace; border-bottom: 1px solid #331555;">LIVE STUDIO CHAT</div>
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input type="text" id="chat-input" placeholder="Say something to the studio..." maxlength="120" />
        <button id="btn-send-chat" onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const sessionToken = 'token_' + Math.random().toString(36).substr(2, 9);
    let hardwareId = localStorage.getItem('goody_hw_id');
    if (!hardwareId) {
      hardwareId = 'hw_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('goody_hw_id', hardwareId);
    }

    const loginPortal = document.getElementById('login-portal');
    const liveStage = document.getElementById('live-stage');
    const hostVideo = document.getElementById('host-video');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');

    let clientPeer = null;
    let dataConn = null;
    let localStream = null;

    document.getElementById('btn-connect').addEventListener('click', () => {
      const name = document.getElementById('input-name').value.trim() || "Guest";
      const city = document.getElementById('input-city').value.trim() || "Earth";
      const roomCode = document.getElementById('input-room').value.trim();
      const role = document.getElementById('input-role').value;

      if (!roomCode || roomCode.length !== 4) {
        alert("Please enter a valid 4-digit studio room code.");
        return;
      }

      loginPortal.style.display = 'none';
      liveStage.style.display = 'flex';

      const studioId = "goody-studio-" + roomCode;
      clientPeer = new Peer();

      clientPeer.on('open', (id) => {
        const metadata = {
          role: role === 'AUDIENCE' ? 'AUDIENCE' : 'CONTESTANT',
          contestant: role,
          name: name,
          city: city,
          passcode: roomCode,
          sessionToken: sessionToken,
          hardwareId: hardwareId
        };

        dataConn = clientPeer.connect(studioId, { metadata: metadata });

        dataConn.on('open', () => {
          appendSystemMessage("Connected to studio master!");
        });

        dataConn.on('data', (data) => {
          if (data.type === 'AUTH_FAILED') {
            alert("Authentication failed: " + data.message);
            window.location.reload();
          }
          if (data.type === 'SLOT_TAKEN') {
            alert(`Slot ${data.takenNum} (${data.slotName}) is already occupied! Try joining as Contestant ${data.altNum} (${data.altSlotName}) or as Audience.`);
            window.location.reload();
          }
          if (data.type === 'HOST_SPEAK') {
            appendSystemMessage(`[GOODY]: ${data.text}`);
          }
          if (data.type === 'AUDIENCE_CHAT_BROADCAST') {
            appendChatMessage(data.author, data.text);
          }
          if (data.type === 'HOST_EJECTED_PLAYER' || data.type === 'HOST_EJECTED_SPECTATOR') {
            alert(data.message);
            window.location.reload();
          }
        });

        if (role !== 'AUDIENCE') {
          navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            localStream = stream;
            const call = clientPeer.call(studioId, stream, { metadata: metadata });
            call.on('stream', (remoteStream) => {
              hostVideo.srcObject = remoteStream;
            });
          }).catch(err => {
            alert("Camera/Microphone access required for contestants.");
            console.error(err);
          });
        } else {
          const call = clientPeer.call(studioId, null, { metadata: metadata });
          call.on('stream', (remoteStream) => {
            hostVideo.srcObject = remoteStream;
          });
        }
      });
    });

    function sendChatMessage() {
      const text = chatInput.value.trim();
      if (!text || !dataConn || !dataConn.open) return;

      const author = document.getElementById('input-name').value.trim() || "Guest";
      dataConn.send({
        type: 'AUDIENCE_CHAT_MESSAGE',
        author: author,
        text: text,
        sessionToken: sessionToken,
        hardwareId: hardwareId
      });

      appendChatMessage(author, text);
      chatInput.value = '';
    }

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChatMessage();
    });

    function appendChatMessage(author, text) {
      const div = document.createElement('div');
      div.innerHTML = `<strong style="color:#00f0ff;">${escapeHtml(author)}:</strong> ${escapeHtml(text)}`;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function appendSystemMessage(text) {
      const div = document.createElement('div');
      div.style.color = '#ffda66';
      div.style.fontStyle = 'italic';
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>

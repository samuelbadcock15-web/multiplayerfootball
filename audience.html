<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Goody Tonight Show - Audience & Contestant Portal</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #06020f; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center;
      overflow: hidden;
    }
    .portal-box {
      background: #140727; border: 2.5px solid #00f0ff; border-radius: 18px;
      padding: 24px 32px; box-shadow: 0 0 40px rgba(0, 240, 255, 0.35);
      text-align: center; max-width: 420px; width: 90%; z-index: 10;
    }
    h2 { color: #ffda66; margin-top: 0; font-size: 1.4rem; letter-spacing: 1px; }
    p { color: #ebdcf9; font-size: 0.88rem; line-height: 1.4; margin: 8px 0; }
    input, select {
      width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem;
      background: #070212; color: #fff; border: 2px solid #a29bfe;
      border-radius: 8px; outline: none; margin-bottom: 12px; text-align: center;
    }
    input:focus { border-color: #39ff14; box-shadow: 0 0 10px rgba(57, 255, 20, 0.4); }
    .btn-join {
      width: 100%; padding: 12px; background: linear-gradient(180deg, #39ff14, #27ae60);
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 900;
      color: #06020f; text-transform: uppercase; cursor: pointer; letter-spacing: 1px;
    }
    .btn-join:hover { background: #00f0ff; }
    
    #live-stage {
      display: none; width: 100%; height: 100%; flex-direction: column; position: relative;
    }
    #video-container {
      flex: 1; background: #000; display: flex; justify-content: center; align-items: center; position: relative;
    }
    video { width: 100%; height: 100%; object-fit: contain; }

    /* HUD TOP BAR */
    #client-hud {
      position: absolute; top: 15px; left: 15px; background: rgba(18, 7, 38, 0.85);
      border: 1.5px solid #ff79b0; border-radius: 10px; padding: 10px 14px;
      font-family: monospace; font-size: 0.8rem; z-index: 25; pointer-events: none;
    }
    #match-clock { color: #00f0ff; font-weight: bold; margin-top: 3px; }

    /* CHAT OVERLAY */
    #chat-overlay {
      position: absolute; bottom: 15px; left: 15px; width: 340px; height: 200px;
      background: rgba(10, 3, 20, 0.85); border: 1.5px solid #00f0ff; border-radius: 10px;
      display: flex; flex-direction: column; backdrop-filter: blur(4px); z-index: 20;
    }
    #chat-messages { flex: 1; overflow-y: auto; padding: 6px; font-size: 0.75rem; display: flex; flex-direction: column; gap: 4px; }
    #chat-input-row { display: flex; padding: 4px; border-top: 1px solid #331555; background: #070212; border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; }
    #chat-input { flex: 1; margin: 0; padding: 6px; font-size: 0.75rem; text-align: left; background: transparent; border: none; color: #fff; outline: none; }
    #btn-send-chat { padding: 6px 12px; background: #00f0ff; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; margin-left: 4px; color: #06020f; font-size: 0.75rem; }
    #btn-send-chat:hover { background: #39ff14; }

    /* TRIVIA QUESTION & ACTION OVERLAY */
    #interaction-overlay {
      position: absolute; top: 20px; right: 20px; width: 360px;
      background: rgba(18, 7, 38, 0.95); border: 2.5px solid #ffda66; border-radius: 14px;
      padding: 16px; color: #fff; display: none; z-index: 30; box-shadow: 0 0 30px rgba(255, 218, 102, 0.3);
    }
    .q-title { font-family: monospace; font-size: 0.75rem; color: #ffda66; font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .q-text { font-size: 0.9rem; font-weight: bold; margin-bottom: 12px; line-height: 1.4; }
    .opt-btn {
      width: 100%; text-align: left; background: #240f45; border: 1.5px solid #a29bfe; color: #fff;
      padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; cursor: pointer; font-size: 0.82rem;
    }
    .opt-btn:hover { background: #6c5ce7; border-color: #ffda66; }
    .opt-btn.selected-correct { background: #00b894 !important; border-color: #55efc4 !important; }
    .opt-btn.selected-wrong { background: #d63031 !important; border-color: #ff7675 !important; }

    /* DICE ROLL ACTION PANEL */
    #action-panel {
      position: absolute; bottom: 25px; right: 20px; background: rgba(18, 7, 38, 0.92);
      border: 2px solid #39ff14; border-radius: 12px; padding: 14px 20px; text-align: center;
      display: none; z-index: 30; font-family: monospace;
    }
    .btn-action {
      background: linear-gradient(180deg, #39ff14, #27ae60); border: none; padding: 10px 20px;
      font-size: 0.9rem; font-weight: bold; color: #06020f; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin-top: 6px;
    }
    .btn-action:hover { background: #00f0ff; }

    /* MIC LIVE PILL */
    #mic-pill {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(214, 48, 49, 0.9); border: 2px solid #ff7675; color: #fff;
      padding: 6px 16px; border-radius: 20px; font-family: monospace; font-size: 0.8rem;
      font-weight: bold; display: none; z-index: 40; box-shadow: 0 0 15px rgba(255, 118, 117, 0.6);
    }
  </style>
</head>
<body>

  <div id="mic-pill">🎙️ MIC LIVE: THINKING OUT LOUD</div>

  <div class="portal-box" id="login-portal">
    <h2>The Goody Tonight Show</h2>
    <p>Join the studio audience or step into the hot seat as a contestant!</p>
    <input type="text" id="input-name" placeholder="Your Name / Handle" maxlength="16" />
    <input type="text" id="input-city" placeholder="Your City" maxlength="16" />
    <input type="text" id="input-room" placeholder="Studio Room Code (4 digits)" maxlength="4" inputmode="numeric" pattern="[0-9]*" />
    <select id="input-role">
      <option value="AUDIENCE">Join as Studio Audience / Spectator</option>
      <option value="goody-contestant-1">Contestant 1 (Podium 1)</option>
      <option value="goody-contestant-2">Contestant 2 (Podium 2)</option>
    </select>
    <button class="btn-join" id="btn-connect">Connect to Studio</button>
  </div>

  <div id="live-stage">
    <div id="client-hud">
      <div id="hud-room">ROOM: ----</div>
      <div id="match-clock">SHOW CLOCK: 20:00</div>
    </div>

    <div id="video-container">
      <video id="host-video" autoplay playsinline></video>
    </div>

    <div id="chat-overlay">
      <div style="padding: 4px 8px; font-size: 0.7rem; color: #ffda66; font-family: monospace; border-bottom: 1px solid #331555; display: flex; justify-content: space-between;">
        <span>LIVE STUDIO CHAT</span>
        <span style="color:#39ff14;">● ON AIR</span>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input type="text" id="chat-input" placeholder="Say something to the studio..." maxlength="120" />
        <button id="btn-send-chat" onclick="sendChatMessage()">Send</button>
      </div>
    </div>

    <div id="interaction-overlay">
      <div class="q-title"><span id="q-country-lbl">TRIVIA QUESTION</span></div>
      <div class="q-text" id="q-text-lbl">Loading question...</div>
      <div id="q-options-box"></div>
    </div>

    <div id="action-panel">
      <div id="action-title" style="color: #ffda66; font-size: 0.85rem; margin-bottom: 6px; font-weight: bold;">YOUR TURN TO ROLL!</div>
      <button class="btn-action" id="btn-roll-dice" onclick="sendRollRequest()">Roll Dice Now</button>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const sessionToken = 'token_' + Math.random().toString(36).substring(2, 11);
    let hardwareId = localStorage.getItem('goody_hw_id');
    if (!hardwareId) {
      hardwareId = 'hw_' + Math.random().toString(36).substring(2, 11);
      localStorage.setItem('goody_hw_id', hardwareId);
    }

    const loginPortal = document.getElementById('login-portal');
    const liveStage = document.getElementById('live-stage');
    const hostVideo = document.getElementById('host-video');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const interactionOverlay = document.getElementById('interaction-overlay');
    const actionPanel = document.getElementById('action-panel');
    const micPill = document.getElementById('mic-pill');

    let clientPeer = null;
    let dataConn = null;
    let localStream = null;
    let assignedSlot = null;
    let myName = "Guest";

    document.getElementById('btn-connect').addEventListener('click', () => {
      myName = document.getElementById('input-name').value.trim() || "Guest";
      const city = document.getElementById('input-city').value.trim() || "Earth";
      const roomCode = document.getElementById('input-room').value.trim();
      const role = document.getElementById('input-role').value;

      if (!roomCode || roomCode.length !== 4) {
        alert("Please enter a valid 4-digit studio room code.");
        return;
      }

      loginPortal.style.display = 'none';
      liveStage.style.display = 'flex';
      document.getElementById('hud-room').textContent = `ROOM: ${roomCode}`;

      const studioId = "goody-studio-" + roomCode;
      assignedSlot = role;
      clientPeer = new Peer();

      clientPeer.on('open', () => {
        const metadata = {
          role: role === 'AUDIENCE' ? 'AUDIENCE' : 'CONTESTANT',
          contestant: role,
          name: myName,
          city: city,
          passcode: roomCode,
          sessionToken: sessionToken,
          hardwareId: hardwareId
        };

        dataConn = clientPeer.connect(studioId, { metadata: metadata });

        dataConn.on('open', () => {
          appendSystemMessage("Connected to studio master!");
        });

        dataConn.on('data', (data) => {
          if (data.type === 'AUTH_FAILED' || data.type === 'AUTH_SUCCESS') {
            if (data.type === 'AUTH_FAILED') {
              alert("Authentication failed: " + data.message);
              window.location.reload();
            }
          } else if (data.type === 'SLOT_TAKEN') {
            alert(`Slot ${data.takenNum} (${data.slotName}) is already occupied! Try joining as Contestant ${data.altNum} (${data.altSlotName}) or as Audience.`);
            window.location.reload();
          } else if (data.type === 'HOST_SPEAK') {
            appendSystemMessage(`[GOODY]: ${data.text}`);
          } else if (data.type === 'AUDIENCE_CHAT_BROADCAST') {
            appendChatMessage(data.author, data.text);
          } else if (data.type === 'SYNC_MATCH_TIMER') {
            document.getElementById('match-clock').textContent = `SHOW CLOCK: ${data.timeStr}`;
          } else if (data.type === 'START_DICE_COUNTDOWN' || data.type === 'ENABLE_TURN_ROLL') {
            actionPanel.style.display = 'block';
          } else if (data.type === 'SHOW_QUESTION_LOCKED' || data.type === 'UNLOCK_QUESTION_INPUT') {
            actionPanel.style.display = 'none';
            presentQuestion(data.question || activeQuestionCache);
          } else if (data.type === 'EVALUATION_RESULT') {
            handleEvaluationResult(data);
          } else if (data.type === 'SET_MIC_STATE') {
            micPill.style.display = data.enabled ? 'block' : 'none';
            if (data.promptText) micPill.textContent = data.promptText;
          } else if (data.type === 'HOST_EJECTED_PLAYER' || data.type === 'HOST_EJECTED_SPECTATOR') {
            alert(data.message || "You were disconnected by the director.");
            window.location.reload();
          }
        });

        if (role !== 'AUDIENCE') {
          navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            localStream = stream;
            const call = clientPeer.call(studioId, stream, { metadata: metadata });
            call.on('stream', (remoteStream) => {
              hostVideo.srcObject = remoteStream;
            });
          }).catch(err => {
            alert("Camera and Microphone access are required for contestants.");
            console.error(err);
          });
        } else {
          const call = clientPeer.call(studioId, null, { metadata: metadata });
          call.on('stream', (remoteStream) => {
            hostVideo.srcObject = remoteStream;
          });
        }
      });
    });

    let activeQuestionCache = null;
    function presentQuestion(qObj) {
      if (!qObj) return;
      activeQuestionCache = qObj;
      document.getElementById('q-country-lbl').textContent = (qObj.country || "TRIVIA").toUpperCase() + " QUESTION";
      document.getElementById('q-text-lbl').textContent = qObj.q;

      const box = document.getElementById('q-options-box');
      box.innerHTML = "";
      qObj.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt;
        btn.onclick = () => submitAnswer(opt, btn);
        box.appendChild(btn);
      });
      interactionOverlay.style.display = 'block';
    }

    function submitAnswer(chosenOption, btnElem) {
      const buttons = document.querySelectorAll('.opt-btn');
      buttons.forEach(b => b.disabled = true);
      btnElem.style.background = '#6c5ce7';

      if (dataConn && dataConn.open) {
        dataConn.send({
          type: 'PLAYER_ANSWERED',
          contestant: assignedSlot,
          chosenAnswer: chosenOption
        });
      }
    }

    function handleEvaluationResult(data) {
      const buttons = document.querySelectorAll('.opt-btn');
      buttons.forEach(b => {
        if (b.textContent === data.chosenAnswer) {
          b.className = data.isCorrect ? 'opt-btn selected-correct' : 'opt-btn selected-wrong';
        }
      });
      setTimeout(() => {
        interactionOverlay.style.display = 'none';
      }, 2200);
    }

    function sendRollRequest() {
      actionPanel.style.display = 'none';
      if (dataConn && dataConn.open) {
        dataConn.send({
          type: 'REQUEST_ROLL',
          contestant: assignedSlot
        });
      }
    }

    function sendChatMessage() {
      const text = chatInput.value.trim();
      if (!text || !dataConn || !dataConn.open) return;

      dataConn.send({
        type: 'AUDIENCE_CHAT_MESSAGE',
        author: myName,
        text: text,
        sessionToken: sessionToken,
        hardwareId: hardwareId
      });

      appendChatMessage(myName, text);
      chatInput.value = '';
    }

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChatMessage();
    });

    function appendChatMessage(author, text) {
      const div = document.createElement('div');
      div.innerHTML = `<strong style="color:#00f0ff;">${escapeHtml(author)}:</strong> ${escapeHtml(text)}`;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function appendSystemMessage(text) {
      const div = document.createElement('div');
      div.style.color = '#ffda66';
      div.style.fontStyle = 'italic';
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>

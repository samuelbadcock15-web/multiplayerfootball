<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Goody Tonight Show - Audience Live Stream</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      background: #06020c; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; display: flex; flex-direction: column; align-items: center;
    }
    #join-gate {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(6, 2, 15, 0.96); z-index: 50; display: flex;
      flex-direction: column; justify-content: center; align-items: center; padding: 20px;
    }
    .gate-box {
      background: #140728; border: 2px solid #00f0ff; border-radius: 16px;
      padding: 24px; max-width: 380px; width: 100%; text-align: center;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    }
    .gate-box h2 { color: #ffda66; font-size: 1.3rem; margin-bottom: 8px; }
    .gate-box p { color: #ebdcf9; font-size: 0.82rem; margin-bottom: 16px; line-height: 1.4; }
    .field-label { display: block; text-align: left; font-size: 0.72rem; color: #ffda66; font-family: monospace; margin-bottom: 4px; }
    .gate-input {
      width: 100%; padding: 10px; margin-bottom: 12px; background: #070212;
      border: 1.5px solid #a29bfe; border-radius: 8px; color: #39ff14;
      font-size: 1.1rem; font-family: monospace; text-align: center; outline: none;
    }
    .btn-connect {
      width: 100%; padding: 12px; background: linear-gradient(180deg, #00f0ff, #0984e3);
      border: none; border-radius: 8px; color: #06020f; font-weight: 900;
      font-size: 0.95rem; text-transform: uppercase; cursor: pointer;
    }

    #stream-wrapper {
      width: 100%; max-width: 600px; flex: 1; display: flex;
      flex-direction: column; padding: 8px; gap: 6px; display: none;
    }
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #140728; padding: 6px 12px; border-radius: 8px;
      font-family: monospace; font-size: 0.78rem; border: 1px solid #331555;
    }
    #stage-viewport {
      width: 100%; aspect-ratio: 16 / 9; background: #000;
      border: 2px solid #ffda66; border-radius: 10px; overflow: hidden; position: relative;
    }
    #studio-feed { width: 100%; height: 100%; object-fit: cover; display: none; }
    #canvas-audience { width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0; }
    
    .swipe-hint {
      position: absolute; top: 6px; left: 8px; font-size: 0.62rem;
      background: rgba(0,0,0,0.65); padding: 2px 6px; border-radius: 4px;
      color: #00f0ff; font-family: monospace; pointer-events: none; z-index: 6;
    }

    #chat-box {
      flex: 1; min-height: 150px; background: rgba(14, 5, 28, 0.92);
      border: 1.5px solid #a29bfe; border-radius: 10px; display: flex;
      flex-direction: column; overflow: hidden;
    }
    #chat-messages {
      flex: 1; overflow-y: auto; padding: 8px; display: flex;
      flex-direction: column; gap: 4px; font-size: 0.76rem;
    }
    .chat-row { word-break: break-word; line-height: 1.3; }
    .chat-user { font-weight: bold; color: #00f0ff; font-family: monospace; }
    .chat-user.is-self { color: #39ff14; }
    .chat-input-bar {
      display: flex; padding: 6px; background: #0b0318; border-top: 1px solid #331555; gap: 6px;
    }
    #chat-input {
      flex: 1; background: #070212; border: 1px solid #a29bfe; border-radius: 6px;
      color: #fff; padding: 8px; font-size: 0.8rem; outline: none;
    }
    #btn-send {
      background: #ffda66; border: none; border-radius: 6px;
      font-weight: bold; padding: 0 14px; cursor: pointer; color: #111;
    }

    .dpad-section {
      background: #140728; border: 1.5px solid #a29bfe; border-radius: 10px;
      padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .dpad-grid { display: grid; grid-template-columns: 46px 46px 46px; grid-template-rows: 32px 32px; gap: 4px; }
    .dpad-btn {
      background: #2b1154; border: 1.5px solid #ff79b0; border-radius: 6px; color: #fff;
      font-size: 1rem; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="join-gate">
    <div class="gate-box">
      <h2>Audience Red Carpet</h2>
      <p>Watch the live game, enter the studio as a plushie, & chat with spectators.</p>
      <span class="field-label">Host Screen Room Code:</span>
      <input type="text" id="code-input" class="gate-input" maxlength="4" placeholder="0000" inputmode="numeric" />
      <span class="field-label">Your Nickname:</span>
      <input type="text" id="name-input" class="gate-input" maxlength="15" placeholder="Spectator" style="color:#00f0ff;" />
      <button class="btn-connect" id="btn-join">Join Show</button>
    </div>
  </div>

  <div id="stream-wrapper">
    <div class="header-bar">
      <span style="color:#ffda66;">GOODY TONIGHT SHOW</span>
      <span id="match-clock-badge" style="color:#00f0ff;">20:00</span>
      <span style="color:#39ff14;">● ON AIR</span>
    </div>

    <div id="stage-viewport">
      <div class="swipe-hint">Drag to Look | WASD / D-Pad to Walk</div>
      <video id="studio-feed" autoplay playsinline></video>
      <canvas id="canvas-audience"></canvas>
    </div>

    <div id="chat-box">
      <div id="chat-messages">
        <div style="color:#888; font-style:italic;">Connecting to live broadcast chat...</div>
      </div>
      <div class="chat-input-bar">
        <input type="text" id="chat-input" maxlength="120" placeholder="Cheer on contestants..." autocomplete="off" />
        <button id="btn-send">SEND</button>
      </div>
    </div>

    <div class="dpad-section">
      <div style="font-size: 0.62rem; color: #ff9ff3; font-family: monospace;">STUDIO WALKABOUT (WASD / D-PAD)</div>
      <div class="dpad-grid">
        <div></div>
        <button class="dpad-btn" id="dpad-fwd">▲</button>
        <div></div>
        <button class="dpad-btn" id="dpad-left">◀</button>
        <button class="dpad-btn" id="dpad-back">▼</button>
        <button class="dpad-btn" id="dpad-right">▶</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let peer = null;
    let dataConn = null;
    let spectatorName = "Spectator";

    let sessionToken = localStorage.getItem("goody_aud_token");
    if (!sessionToken) {
      sessionToken = "aud_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("goody_aud_token", sessionToken);
    }

    function generateHardwareId() {
      try {
        const c = document.createElement('canvas');
        const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
        const d = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
        const rend = d && gl ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : 'gpu';
        const str = `${rend}|${screen.width}x${screen.height}|${navigator.hardwareConcurrency || 4}`;
        let h = 0;
        for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
        return 'hw_' + Math.abs(h).toString(16);
      } catch (e) {
        return 'hw_' + Math.random().toString(36).substring(2, 9);
      }
    }
    const hardwareId = generateHardwareId();

    const baseProfanities = ["fuck", "shit", "bitch", "cunt", "nigger", "nigga", "faggot", "retard", "whore", "slut", "pussy", "dick", "bastard", "asshole"];
    function normalizeText(str) {
      return str.toLowerCase().replace(/[@4]/g, 'a').replace(/[1!|]/g, 'i').replace(/[0]/g, 'o').replace(/[3]/g, 'e').replace(/[$5]/g, 's').replace(/[+]/g, 't').replace(/[^a-z0-9]/g, '');
    }
    function checkProfanityEvasion(text) {
      const normalized = normalizeText(text);
      return baseProfanities.some(bad => normalized.includes(bad));
    }

    const joinGate = document.getElementById('join-gate');
    const streamWrapper = document.getElementById('stream-wrapper');
    const codeInput = document.getElementById('code-input');
    const nameInput = document.getElementById('name-input');
    const btnJoin = document.getElementById('btn-join');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const btnSend = document.getElementById('btn-send');
    const studioFeed = document.getElementById('studio-feed');
    const matchClockBadge = document.getElementById('match-clock-badge');
    const canvasAudience = document.getElementById('canvas-audience');

    // THREE.JS SPECTATOR 3D ENVIRONMENT
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, 16/9, 0.1, 50);
    camera.position.set(0, 3.2, 5.0);

    const renderer = new THREE.WebGLRenderer({ canvas: canvasAudience, antialias: true, alpha: true });
    renderer.setSize(canvasAudience.clientWidth, canvasAudience.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    // My Plushie Avatar
    function createPlushieModel(colorHex) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.9 });
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), mat);
      body.position.y = 0.25; group.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), mat);
      head.position.y = 0.52; group.add(head);
      return group;
    }

    const myColor = Math.random() * 0xffffff;
    const myAvatar = createPlushieModel(myColor);
    myAvatar.position.set((Math.random() - 0.5) * 4, 0, 2.0);
    scene.add(myAvatar);

    const remotePeersAvatars = new Map();

    let myYaw = 0;
    let myPitch = 0;
    const myPos = myAvatar.position;

    btnJoin.addEventListener('click', () => {
      const code = codeInput.value.trim();
      spectatorName = nameInput.value.trim() || "Spectator";

      if (!/^\d{4}$/.test(code)) {
        alert("Enter the 4-digit room code shown on the host screen.");
        return;
      }
      joinGate.style.display = 'none';
      streamWrapper.style.display = 'flex';
      connectToStudio(code);
    });

    function addMessage(author, text, isSelf = false) {
      const row = document.createElement('div');
      row.className = 'chat-row';
      const userSpan = document.createElement('span');
      userSpan.className = `chat-user ${isSelf ? 'is-self' : ''}`;
      userSpan.textContent = author + ': ';
      row.appendChild(userSpan);
      row.appendChild(document.createTextNode(text));
      chatMessages.appendChild(row);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function connectToStudio(code) {
      peer = new Peer();

      peer.on('open', (myPeerId) => {
        const targetStudioId = "goody-studio-" + code;

        const call = peer.call(targetStudioId, null, {
          metadata: { role: 'AUDIENCE', sessionToken: sessionToken, name: spectatorName }
        });

        if (call) {
          call.on('stream', (stream) => {
            studioFeed.srcObject = stream;
            studioFeed.style.display = 'block';
            studioFeed.play().catch(console.error);
          });
        }

        dataConn = peer.connect(targetStudioId, {
          metadata: { role: 'AUDIENCE', sessionToken: sessionToken, name: spectatorName }
        });

        dataConn.on('data', (data) => {
          if (data.type === "AUDIENCE_CHAT_BROADCAST") {
            addMessage(data.author, data.text);
          } else if (data.type === "SYNC_MATCH_TIMER") {
            matchClockBadge.textContent = data.timeStr;
          } else if (data.type === "SPECTATOR_POS_RELAY") {
            updateRemoteAvatar(data);
          } else if (data.type === "HOST_EJECTED_SPECTATOR") {
            alert(data.message || "You have been disconnected from the studio.");
            location.reload();
          }
        });
      });
    }

    function updateRemoteAvatar(data) {
      let avatar = remotePeersAvatars.get(data.peerId);
      if (!avatar) {
        avatar = createPlushieModel(0x00f0ff);
        scene.add(avatar);
        remotePeersAvatars.set(data.peerId, avatar);
      }
      avatar.position.set(data.x, data.y, data.z);
      avatar.rotation.y = data.yaw;
    }

    function sendPositionToServer() {
      if (dataConn && dataConn.open) {
        dataConn.send({
          type: "SPECTATOR_MOVE",
          peerId: peer.id,
          name: spectatorName,
          x: myPos.x,
          y: myPos.y,
          z: myPos.z,
          yaw: myYaw
        });
      }
    }

    // Controls & Walkabout
    function moveAvatar(dir) {
      const speed = 0.12;
      const fwdX = -Math.sin(myYaw);
      const fwdZ = -Math.cos(myYaw);
      const rightX = Math.cos(myYaw);
      const rightZ = -Math.sin(myYaw);

      if (dir === 'FORWARD') { myPos.x += fwdX * speed; myPos.z += fwdZ * speed; }
      if (dir === 'BACK') { myPos.x -= fwdX * speed; myPos.z -= fwdZ * speed; }
      if (dir === 'LEFT') { myPos.x -= rightX * speed; myPos.z -= rightZ * speed; }
      if (dir === 'RIGHT') { myPos.x += rightX * speed; myPos.z += rightZ * speed; }

      myPos.x = Math.max(-4, Math.min(4, myPos.x));
      myPos.z = Math.max(-1, Math.min(6, myPos.z));
      myAvatar.position.copy(myPos);
      sendPositionToServer();
    }

    let activeDir = null;
    let walkInterval = null;
    function startWalking(dir) {
      if (activeDir === dir) return;
      activeDir = dir;
      moveAvatar(dir);
      if (walkInterval) clearInterval(walkInterval);
      walkInterval = setInterval(() => moveAvatar(dir), 50);
    }
    function stopWalking() {
      activeDir = null;
      if (walkInterval) { clearInterval(walkInterval); walkInterval = null; }
    }

    const bindDpad = (btnId, dir) => {
      const el = document.getElementById(btnId);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); startWalking(dir); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); stopWalking(); });
      el.addEventListener('mousedown', () => startWalking(dir));
      el.addEventListener('mouseup', () => stopWalking());
    };
    bindDpad('dpad-fwd', 'FORWARD');
    bindDpad('dpad-back', 'BACK');
    bindDpad('dpad-left', 'LEFT');
    bindDpad('dpad-right', 'RIGHT');

    // Look around touch drag
    let isDragging = false;
    let startX = 0;
    const viewport = document.getElementById('stage-viewport');
    viewport.addEventListener('touchstart', (e) => { if(e.touches.length === 1) { isDragging = true; startX = e.touches[0].clientX; } });
    viewport.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - startX;
      startX = e.touches[0].clientX;
      myYaw -= dx * 0.01;
      myAvatar.rotation.y = myYaw;
      sendPositionToServer();
    });
    viewport.addEventListener('touchend', () => { isDragging = false; });

    function sendChat() {
      const text = chatInput.value.trim();
      if (!text) return;
      const isBad = checkProfanityEvasion(text);
      addMessage(spectatorName, text, true);
      chatInput.value = '';

      if (dataConn && dataConn.open) {
        dataConn.send({
          type: "AUDIENCE_CHAT_MESSAGE",
          author: spectatorName,
          text: text,
          sessionToken: sessionToken,
          hardwareId: hardwareId,
          evasionFlagged: isBad
        });
      }
    }

    btnSend.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      camera.position.set(myPos.x + Math.sin(myYaw) * 3.5, myPos.y + 1.8, myPos.z + Math.cos(myYaw) * 3.5);
      camera.lookAt(myPos.x, myPos.y + 0.5, myPos.z);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

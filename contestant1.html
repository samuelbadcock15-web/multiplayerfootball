<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goody Tonight Show - Contestant 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #090314;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px;
    }

    #setup-card {
      width: 100%; max-width: 420px; background: #1b0933; border: 2px solid #0984e3;
      border-radius: 16px; padding: 20px; text-align: center; margin-top: 14px;
      box-shadow: 0 0 20px rgba(9, 132, 227, 0.35);
    }
    .badge-podium {
      display: inline-block;
      padding: 4px 10px;
      background: #0984e3;
      color: #fff;
      font-family: monospace;
      font-weight: 900;
      font-size: 0.8rem;
      border-radius: 6px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .input-label {
      font-size: 0.72rem;
      font-family: monospace;
      color: #ffda66;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
      display: block;
      text-align: left;
    }
    .form-group {
      margin-bottom: 10px;
      text-align: left;
    }
    #passcode-input {
      width: 100%;
      padding: 8px;
      font-size: 1.6rem;
      font-family: monospace;
      font-weight: 900;
      letter-spacing: 8px;
      text-align: center;
      background: #080313;
      color: #39ff14;
      border: 2px solid #a29bfe;
      border-radius: 10px;
      outline: none;
    }
    .text-field {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      font-weight: bold;
      background: #080313;
      color: #00f0ff;
      border: 2px solid #a29bfe;
      border-radius: 10px;
      outline: none;
    }
    .btn-enter {
      width: 100%; padding: 14px; margin-top: 6px; border-radius: 12px; border: none;
      font-size: 1rem; font-weight: 900; text-transform: uppercase; cursor: pointer; color: #fff;
      background: linear-gradient(180deg, #0984e3, #0652dd);
      box-shadow: 0 3px 0 #003366, 0 0 14px rgba(9, 132, 227, 0.5);
    }

    #live-stage-portal {
      width: 100%; max-width: 440px; height: 100%;
      display: none; flex-direction: column; justify-content: space-between; gap: 4px;
    }
    .badge-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #18092d; padding: 4px 8px; border-radius: 6px;
      font-family: monospace; font-size: 0.72rem; flex-shrink: 0;
    }
    #mic-status-badge {
      display: none; background: #27ae60; color: #fff; padding: 2px 6px;
      border-radius: 4px; font-weight: 900;
    }
    .screens-container {
      position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 23vh;
      background: #000; border: 2px solid #ffda66; border-radius: 10px; overflow: hidden; flex-shrink: 0; margin: 0 auto;
    }
    #studio-stream-video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    #local-selfie-pip {
      position: absolute; bottom: 4px; right: 4px; width: 26%; aspect-ratio: 4 / 3;
      border: 2px solid #39ff14; border-radius: 6px; object-fit: cover; transform: scaleX(-1); background: #111; z-index: 5;
    }
    #turn-banner {
      width: 100%; padding: 4px 8px; border-radius: 6px; text-align: center;
      font-weight: 900; font-size: 0.72rem; font-family: monospace; text-transform: uppercase; display: none; flex-shrink: 0;
    }
    .turn-mine { background: #00b894; color: #fff; border: 1.5px solid #55efc4; }
    .turn-theirs { background: #2d1847; color: #dfe6e9; border: 1.5px solid #636e72; }
    .turn-tie { background: #e17055; color: #fff; border: 1.5px solid #fdcb6e; }
    .turn-paused { background: #d63031; color: #fff; border: 1.5px solid #ff7675; }

    #status-pill {
      text-align: center; font-family: monospace; font-size: 0.75rem; color: #39ff14; min-height: 16px; flex-shrink: 0;
    }
    #choice-card {
      background: #1f0b3b; border: 2px solid #f1c40f; border-radius: 12px;
      padding: 10px; display: none; flex-direction: column; gap: 8px; text-align: center; flex-shrink: 0;
    }
    .choice-btn {
      width: 100%; padding: 12px; border-radius: 8px; border: 2px solid;
      font-size: 0.85rem; font-weight: 900; text-transform: uppercase; cursor: pointer; color: #fff;
    }
    .btn-choice-solo { background: #2980b9; border-color: #3498db; }
    .btn-choice-goody { background: #8e44ad; border-color: #9b59b6; }

    #btn-roll-dice {
      width: 100%; padding: 10px; background: #444; border: 2px solid #777;
      border-radius: 10px; font-size: 0.9rem; font-weight: 900; color: #888;
      text-transform: uppercase; cursor: not-allowed; flex-shrink: 0;
    }
    #btn-roll-dice.active-roll {
      background: linear-gradient(180deg, #fdcb6e, #e17055);
      border-color: #ffeaa7; color: #2d3436; cursor: pointer;
    }

    #chat-container {
      width: 100%; max-width: 420px; background: rgba(13, 5, 26, 0.95);
      border: 1.5px solid #d4af37; border-radius: 10px; display: flex; flex-direction: column;
      flex: 1; min-height: 160px; max-height: 32vh; margin-bottom: 4px;
    }
    #chat-header {
      padding: 5px 8px; background: #230a42; font-size: 0.72rem; font-weight: bold; color: #ffda66;
      display: flex; justify-content: space-between; align-items: center;
    }
    #chat-messages {
      flex: 1; overflow-y: auto; padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; font-size: 0.76rem;
    }
    .chat-msg { word-break: break-word; line-height: 1.25; }
    .chat-author { font-weight: bold; color: #39ff14; font-family: monospace; }
    .chat-author.is-self { color: #00f0ff; }
    .chat-author.is-host { color: #ff7675; }

    .chat-trivia-card {
      background: #1c0a35; border: 2px solid #00f0ff; border-radius: 8px; padding: 8px; margin: 4px 0;
    }
    .chat-trivia-country { font-size: 0.68rem; font-family: monospace; color: #ffda66; font-weight: bold; margin-bottom: 2px; }
    .chat-trivia-text { font-size: 0.76rem; color: #fff; font-weight: 600; margin-bottom: 6px; }
    .chat-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .chat-opt-btn {
      background: #2b1154; border: 1.5px solid #a29bfe; border-radius: 5px; color: #fff;
      padding: 5px 6px; font-size: 0.7rem; font-weight: bold; text-align: left; cursor: pointer;
    }
    .chat-opt-btn.selected { background: #0984e3 !important; border-color: #00f0ff !important; }
    .chat-opt-btn.correct { background: #00b894 !important; border-color: #55efc4 !important; }
    .chat-opt-btn.wrong { background: #d63031 !important; border-color: #ff7675 !important; }
    .chat-opt-btn:disabled { cursor: default; opacity: 0.9; }

    .chat-input-row { display: flex; border-top: 1px solid #442266; padding: 4px; gap: 4px; }
    #chat-text-input {
      flex: 1; background: #080313; border: 1px solid #a29bfe; border-radius: 6px;
      color: #fff; padding: 6px 8px; font-size: 0.78rem; outline: none;
    }
    #btn-send-chat {
      background: #d4af37; border: none; border-radius: 6px; color: #111; font-weight: bold;
      font-size: 0.7rem; padding: 0 10px; cursor: pointer;
    }

    .dpad-section {
      background: #140728; border: 1.5px solid #a29bfe; border-radius: 10px;
      padding: 3px; display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0;
    }
    .dpad-grid { display: grid; grid-template-columns: 42px 42px 42px; grid-template-rows: 28px 28px; gap: 3px; }
    .dpad-btn {
      background: #2b1154; border: 1.5px solid #ff79b0; border-radius: 5px; color: #fff;
      font-size: 0.9rem; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="setup-card">
    <div class="badge-podium">PODIUM 1</div>
    <h2 style="color: #ffda66; margin-bottom: 12px; font-size: 1.25rem;">The Goody Tonight Show</h2>
   
    <div class="form-group">
      <span class="input-label">Host Screen 4-Digit Code:</span>
      <input type="text" id="passcode-input" maxlength="4" placeholder="0000" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
    </div>

    <div class="form-group">
      <span class="input-label">First Name:</span>
      <input type="text" id="name-input" class="text-field" maxlength="15" placeholder="e.g. Alex" autocomplete="given-name" />
    </div>

    <div class="form-group">
      <span class="input-label">Hometown / City:</span>
      <input type="text" id="city-input" class="text-field" maxlength="20" placeholder="e.g. London" autocomplete="address-level2" />
    </div>

    <button class="btn-enter" id="btn-enter-studio">Enter Live Studio</button>
  </div>

  <main id="live-stage-portal">
    <div class="badge-bar">
      <span id="role-tag" style="color: #00f0ff;">CONNECTING...</span>
      <span id="mic-status-badge"> MIC LIVE</span>
      <span id="match-timer-badge" style="color: #ffda66;"> 20:00</span>
      <span style="color: #39ff14;"> LIVE</span>
    </div>

    <div class="screens-container" id="interactive-viewport">
      <video id="studio-stream-video" autoplay playsinline></video>
      <video id="local-selfie-pip" autoplay playsinline muted></video>
    </div>

    <div id="turn-banner"></div>
    <div id="status-pill">Waiting for host...</div>

    <div id="choice-card">
      <div id="choice-title">Make Your Choice, Contestant!</div>
      <button class="choice-btn btn-choice-solo" id="btn-pick-solo">Race Solo Against Clock</button>
      <button class="choice-btn btn-choice-goody" id="btn-pick-goody">Battle Goody Head-To-Head</button>
    </div>

    <button id="btn-roll-dice" disabled>ROLL DICE (LOCKED)</button>

    <div id="chat-container">
      <div id="chat-header">
        <span>COMMUNAL CHAT & TRIVIA [CLOCK: <span id="c1-chat-clock" style="color:#ffda66;">20:00</span>]</span>
      </div>
      <div id="chat-messages">
        <div class="chat-msg" style="color:#aaa; font-style:italic;">Connected to studio feed...</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chat-text-input" maxlength="120" placeholder="Say something..." autocomplete="off" />
        <button id="btn-send-chat">SEND</button>
      </div>
    </div>

    <div class="dpad-section">
      <div style="font-size: 0.6rem; color: #ff9ff3; font-family: monospace;">STUDIO NAVIGATION</div>
      <div class="dpad-grid">
        <div></div>
        <button class="dpad-btn" id="dpad-fwd">▲</button>
        <div></div>
        <button class="dpad-btn" id="dpad-left">◀</button>
        <button class="dpad-btn" id="dpad-back">▼</button>
        <button class="dpad-btn" id="dpad-right">▶</button>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const CONTESTANT_ID = "goody-contestant-1";
    let localStream = null, peer = null, dataConn = null, mediaCall = null;
    let contestantName = "", contestantCity = "", hasRolled = false, rollTimer = null;
    let currentQuestionData = null, selectedOptionIndex = null;

    const passcodeInput = document.getElementById('passcode-input');
    const nameInput = document.getElementById('name-input');
    const cityInput = document.getElementById('city-input');
    const btnEnterStudio = document.getElementById('btn-enter-studio');
    const setupCard = document.getElementById('setup-card');
    const liveStagePortal = document.getElementById('live-stage-portal');
    const localSelfiePip = document.getElementById('local-selfie-pip');
    const studioStreamVideo = document.getElementById('studio-stream-video');
    const roleTag = document.getElementById('role-tag');
    const micStatusBadge = document.getElementById('mic-status-badge');
    const matchTimerBadge = document.getElementById('match-timer-badge');
    const c1ChatClock = document.getElementById('c1-chat-clock');
    const turnBanner = document.getElementById('turn-banner');
    const statusPill = document.getElementById('status-pill');
    const btnRollDice = document.getElementById('btn-roll-dice');
    const choiceCard = document.getElementById('choice-card');
    const btnPickSolo = document.getElementById('btn-pick-solo');
    const btnPickGoody = document.getElementById('btn-pick-goody');
    const chatMessages = document.getElementById('chat-messages');
    const chatTextInput = document.getElementById('chat-text-input');
    const btnSendChat = document.getElementById('btn-send-chat');

    function setLocalMicEnabled(enabled) {
      if (localStream && localStream.getAudioTracks().length > 0) {
        localStream.getAudioTracks()[0].enabled = enabled;
      }
      micStatusBadge.style.display = enabled ? 'inline-block' : 'none';
    }

    function addChatMessage(author, text, customClass = '') {
      const msgEl = document.createElement('div');
      msgEl.className = 'chat-msg';
      const authorSpan = document.createElement('span');
      authorSpan.className = `chat-author ${customClass}`;
      authorSpan.textContent = author + ': ';
      const textSpan = document.createElement('span');
      textSpan.textContent = text;
      msgEl.appendChild(authorSpan);
      msgEl.appendChild(textSpan);
      chatMessages.appendChild(msgEl);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendChatMessage() {
      const text = chatTextInput.value.trim();
      if (!text) return;
      addChatMessage(contestantName || "Alex", text, 'is-self');
      chatTextInput.value = '';
      if (dataConn && dataConn.open) {
        dataConn.send({ type: "AUDIENCE_CHAT_MESSAGE", author: contestantName || "Alex", text: text });
      }
    }
    btnSendChat.addEventListener('click', sendChatMessage);
    chatTextInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChatMessage(); });

    btnEnterStudio.addEventListener('click', async () => {
      const code = passcodeInput.value.trim();
      const name = nameInput.value.trim();
      const city = cityInput.value.trim() || "London";
      if (!/^\d{4}$/.test(code)) { alert("Enter the 4-digit code."); return; }
      if (!name) { alert("Enter your name."); return; }

      setupCard.style.display = 'none';
      liveStagePortal.style.display = 'flex';

      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localSelfiePip.srcObject = localStream;
      setLocalMicEnabled(false);

      peer = new Peer();
      peer.on('open', () => {
        const studioId = "goody-studio-" + code;
        mediaCall = peer.call(studioId, localStream, { metadata: { contestant: CONTESTANT_ID, name, city, passcode: code } });
        mediaCall.on('stream', (stream) => { studioStreamVideo.srcObject = stream; studioStreamVideo.play(); });

        dataConn = peer.connect(studioId, { metadata: { contestant: CONTESTANT_ID, name, city, passcode: code } });
        dataConn.on('data', (data) => {
          if (data.type === "AUTH_SUCCESS") {
            roleTag.textContent = `${name.toUpperCase()} (CONTESTANT 1)`;
          } else if (data.type === "SET_MIC_STATE") {
            setLocalMicEnabled(data.enabled);
          } else if (data.type === "START_DICE_COUNTDOWN" || data.type === "ENABLE_TURN_ROLL") {
            btnRollDice.style.display = 'block';
            btnRollDice.disabled = false;
            btnRollDice.classList.add('active-roll');
            btnRollDice.textContent = "ROLL DICE NOW!";
          } else if (data.type === "SHOW_QUESTION_LOCKED") {
            btnRollDice.style.display = 'none';
          }
        });
      });
    });

    btnRollDice.addEventListener('click', () => {
      btnRollDice.disabled = true;
      btnRollDice.classList.remove('active-roll');
      if (dataConn && dataConn.open) {
        dataConn.send({ type: "REQUEST_ROLL", contestant: CONTESTANT_ID });
      }
    });

    btnPickSolo.addEventListener('click', () => {
      choiceCard.style.display = 'none';
      dataConn.send({ type: "CONTESTANT_CHOSE_PATH", choice: "SOLO", contestant: CONTESTANT_ID });
    });
    btnPickGoody.addEventListener('click', () => {
      choiceCard.style.display = 'none';
      dataConn.send({ type: "CONTESTANT_CHOSE_PATH", choice: "GOODY", contestant: CONTESTANT_ID });
    });
  </script>
</body>
</html>
